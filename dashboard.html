<!DOCTYPE html>
<html lang="en">
<head>
  {% include analytics.html %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Panel — Arjun Thakur</title>
  <meta name="description" content="Private quick-launch control panel.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#22d3ee">

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20260716-1">

  <style>
    .dash-section { padding: 3rem 0 4rem; }
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1.1rem;
      margin-top: 2rem;
    }
    .dash-tile {
      display: flex; flex-direction: column; align-items: center; gap: .85rem;
      background: linear-gradient(180deg, var(--card-bg) 0%, var(--card-elevated) 100%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 1.6rem 1rem;
      text-decoration: none;
      color: var(--text-primary);
      text-align: center;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .dash-tile:hover {
      transform: translateY(-3px);
      border-color: rgba(34,211,238,0.45);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }
    .dash-ico {
      width: 54px; height: 54px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 700;
      background: var(--gradient-subtle);
      border: 1px solid var(--border-subtle);
    }
    .dash-name { font-weight: 600; font-size: .95rem; }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

{% include nav.html %}

  <main id="main-content">
  <section class="dash-section">
    <div class="container">

      <h1 class="section-title">Control Panel</h1>

      <div class="dash-grid">
        <a class="dash-tile" href="https://arjunthakur.dev/" target="_blank" rel="noopener">
          <div class="dash-ico">🌐</div>
          <div class="dash-name">Website</div>
        </a>

        <a class="dash-tile" href="https://linkedin.com/in/thakurarjun247" target="_blank" rel="me noopener">
          <div class="dash-ico">in</div>
          <div class="dash-name">LinkedIn</div>
        </a>

        <a class="dash-tile" href="https://mail.google.com/" target="_blank" rel="noopener">
          <div class="dash-ico">✉️</div>
          <div class="dash-name">Gmail</div>
        </a>

        <a class="dash-tile" href="https://mail.zoho.com/" target="_blank" rel="noopener">
          <div class="dash-ico">📮</div>
          <div class="dash-name">Zoho Mail</div>
        </a>

        <a class="dash-tile" href="https://calendar.zoho.com/" target="_blank" rel="noopener">
          <div class="dash-ico">📅</div>
          <div class="dash-name">Zoho Calendar</div>
        </a>

        <a class="dash-tile" href="https://zoom.us/start/videomeeting" target="_blank" rel="noopener">
          <div class="dash-ico">🎥</div>
          <div class="dash-name">New Zoom Meeting</div>
        </a>

        <a class="dash-tile" href="https://claude.ai/new" target="_blank" rel="noopener">
          <div class="dash-ico">✦</div>
          <div class="dash-name">Claude / Cowork</div>
        </a>
      </div>

    </div>
  </section>
  </main>

{% include footer.html %}

  <script src="js/main.js?v=20260702-1" defer></script>
</body>
</html>
